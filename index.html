<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Remover</title>
    <!-- Cropper.js for smooth cropping -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #080c08;
            color: #00ff66;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* Step 1 Page Container */
        .container {
            position: relative;
            width: 92vw;
            max-width: 440px;
            height: auto;
            min-height: 320px;
            background: #111811;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #00ff66;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* Step 2 & Step 3 Full Screen Expanded Mode */
        .container.expanded {
            width: 98vw;
            max-width: 960px;
            height: 96vh;
            max-height: 96vh;
            padding: 14px;
            justify-content: space-between;
        }
        
        /* 3-DOT MENU STYLES */
        .menu-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #00ff66;
            user-select: none;
            padding: 0 8px;
            border-radius: 6px;
            z-index: 100;
        }
        .menu-btn:hover {
            background: #1a261a;
        }
        .dropdown-menu {
            position: absolute;
            top: 45px;
            right: 15px;
            background: #141c14;
            border: 2px solid #00ff66;
            border-radius: 8px;
            padding: 12px;
            width: 190px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 101;
            text-align: left;
        }
        .credit-info {
            font-size: 0.85rem;
            color: #00ff66;
        }
        .credit-count {
            font-size: 1.05rem;
            font-weight: bold;
            color: #ffffff;
            margin-top: 4px;
            display: block;
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #00ff66;
            width: 100%;
        }

        .step-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .container.expanded .step-section {
            height: calc(100% - 40px);
            justify-content: space-between;
        }

        /* UPLOAD BOX (Center Aligned) */
        .upload-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .upload-card {
            width: 100%;
            height: 180px;
            border: 2px dashed #00ff66;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f150f;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            padding: 15px;
        }
        .upload-card:hover {
            background: #162216;
            border-color: #33ff88;
        }
        .upload-icon-circle {
            width: 55px;
            height: 55px;
            background: #152215;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            border: 1px solid #00ff66;
        }
        .upload-icon {
            font-size: 26px;
        }
        .upload-card p {
            font-size: 0.95rem;
            color: #ffffff;
            font-weight: 600;
        }
        .upload-card span {
            font-size: 0.72rem;
            color: #7a917a;
            margin-top: 6px;
        }
        #upload {
            display: none;
        }

        input, select {
            margin: 4px;
            padding: 8px 12px;
            background: #141c14;
            color: #00ff66;
            border: 1px solid #00ff66;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }
        
        button {
            padding: 9px 16px;
            background: #00ff66;
            color: #080c08;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            margin: 4px;
            border-radius: 6px;
            transition: 0.2s ease;
        }
        button:hover {
            background: #22ff77;
        }

        /* Smooth Cropper Container */
        .img-container {
            width: 100%;
            flex: 1;
            min-height: 0;
            max-height: 72vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #040704;
            border-radius: 8px;
            border: 1px solid #00ff6644;
            margin-bottom: 8px;
            overflow: hidden;
            touch-action: none;
        }
        #crop-image {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
        
        /* Canvas Wrapper & Thin Border Canvas */
        .canvas-wrapper {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        canvas {
            border: 1px solid #00ff66; /* Thin Border for Photo View */
            max-width: 100%;
            max-height: 65vh;
            width: auto;
            height: auto;
            background-color: #141c14;
            object-fit: contain;
            border-radius: 4px;
        }
        
        .hidden {
            display: none !important;
        }
        .color-presets {
            margin: 3px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .preset-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid #00ff66;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }
        
        /* Loading Animation */
        #loading {
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .spinner-container {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .dot {
            width: 14px;
            height: 14px;
            background-color: #00ff66;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { animation-delay: 0s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1.0); opacity: 1; }
        }

        .loading-text {
            font-size: 0.95rem;
            color: #00ff66;
            letter-spacing: 0.5px;
            text-align: center;
            font-weight: 500;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <!-- 3-Dot Menu Icon -->
    <div class="menu-btn" id="menu-icon" onclick="toggleMenu(event)">⋮</div>

    <!-- Dropdown Menu Box -->
    <div id="dropdown-menu" class="dropdown-menu hidden">
        <div class="credit-info">
            Total Credits Left:
            <span id="credit-display" class="credit-count">78 / 100</span>
        </div>
    </div>

    <h2>Background Remover</h2>

    <!-- Step 1: Modern Upload Card -->
    <div id="step-1" class="step-section">
        <div class="upload-wrapper">
            <label for="upload" class="upload-card">
                <div class="upload-icon-circle">
                    <span class="upload-icon">📸</span>
                </div>
                <p>Choose or Drag Photo</p>
                <span>Supports JPG, PNG, WEBP, HEIC & all formats</span>
            </label>
            <input type="file" id="upload" accept="image/*, .png, .jpg, .jpeg, .webp, .heic, .bmp, .gif, .tiff, .svg, .avif">
        </div>
    </div>

    <!-- Step 2: Crop Photo -->
    <div id="step-2" class="step-section hidden">
        <div class="img-container">
            <img id="crop-image" src="" alt="Crop Area">
        </div>
        <div class="controls-row">
            <label style="font-size: 0.9rem;">Size / Ratio: </label>
            <select id="size-preset">
                <option value="3.5/4.5" selected>Standard Passport (3.5 x 4.5 cm)</option>
                <option value="manual">Manual Crop</option>
                <option value="joint">Joint Photo (4 x 6 Ratio)</option>
                <option value="nocrop">No Crop (Direct Process)</option>
            </select>
            <button onclick="cropAndRemoveBg()">Process & Remove BG</button>
            <button onclick="fullReset()" style="background:#ff4444; color:#fff;">Change Photo</button>
        </div>
    </div>

    <!-- Loading Spinner Indicator -->
    <div id="loading" class="step-section hidden">
        <div class="spinner-container">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="loading-text">Processing background removal in HD...</div>
    </div>

    <!-- Step 3: Final Preview & Customization -->
    <div id="step-3" class="step-section hidden">
        <div class="canvas-wrapper">
            <canvas id="final-canvas"></canvas>
        </div>

        <div class="controls-row">
            <label style="font-size: 0.9rem;">BG Color: </label>
            <input type="color" id="bg-color" value="#ffffff" onchange="renderFinalPhoto()">
            
            <div class="color-presets">
                <button class="preset-btn" style="background:#ffffff;" onclick="setColor('#ffffff')"></button>
                <button class="preset-btn" style="background:#0055ff;" onclick="setColor('#0055ff')"></button>
                <button class="preset-btn" style="background:#00aaff;" onclick="setColor('#00aaff')"></button>
                <button class="preset-btn" style="background:#00ff66;" onclick="setColor('#00ff66')"></button>
                <button class="preset-btn" style="background:#e0e0e0;" onclick="setColor('#e0e0e0')"></button>
            </div>

            <label style="font-size: 0.9rem;">Border: </label>
            <select id="border-option" onchange="renderFinalPhoto()">
                <option value="none">No Border</option>
                <option value="thin">Thin Border</option>
                <option value="thick">Thick Border</option>
            </select>

            <label style="font-size: 0.9rem;">Format: </label>
            <select id="download-format">
                <option value="image/png">PNG (HD)</option>
                <option value="image/jpeg">JPEG (HD)</option>
            </select>
        </div>

        <div class="controls-row" style="margin-top: 6px;">
            <button onclick="downloadImage()">Download HD</button>
            <button onclick="reCropCurrentPhoto()" style="background:#ffaa00; color:#080c08;">Re-Crop Image</button>
        </div>
    </div>
</div>

<script>
    const API_KEYS = [
        "TL3eqdjYhAZcL1ZZH3qaescs", 
        "is3ZKbYU9jNDVTFS1uru81RD"
    ];

    let cropper = null;
    let bgRemovedBlob = null;
    let rawImageSrc = null;
    let originalFileBlob = null;

    // Credit Tracker (Default restored to 78/100)
    let creditsLeft = localStorage.getItem('total_credits') !== null ? parseInt(localStorage.getItem('total_credits')) : 78;
    updateCreditUI();

    function toggleMenu(event) {
        event.stopPropagation();
        document.getElementById('dropdown-menu').classList.toggle('hidden');
    }

    document.addEventListener('click', function(event) {
        const menu = document.getElementById('dropdown-menu');
        const menuBtn = document.getElementById('menu-icon');
        if (!menu.contains(event.target) && !menuBtn.contains(event.target)) {
            menu.classList.add('hidden');
        }
    });

    function updateCreditUI() {
        document.getElementById('credit-display').innerText = `${creditsLeft} / 100`;
    }

    function deductCredit() {
        if (creditsLeft > 0) {
            creditsLeft--;
            localStorage.setItem('total_credits', creditsLeft);
            updateCreditUI();
        }
    }

    const fileInput = document.getElementById('upload');
    const cropImgElement = document.getElementById('crop-image');
    const sizePreset = document.getElementById('size-preset');

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            originalFileBlob = file;
            const reader = new FileReader();
            reader.onload = function(event) {
                rawImageSrc = event.target.result;
                openCropperScreen(rawImageSrc);
            };
            reader.readAsDataURL(file);
        }
    });

    function openCropperScreen(imageSource) {
        document.getElementById('main-container').classList.add('expanded');

        cropImgElement.src = imageSource;
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('step-3').classList.add('hidden');
        document.getElementById('step-2').classList.remove('hidden');

        if (cropper) {
            cropper.destroy();
        }

        // Set to Passport size by default
        sizePreset.value = '3.5/4.5';

        cropper = new Cropper(cropImgElement, {
            aspectRatio: 3.5 / 4.5, // Default Passport Ratio
            viewMode: 1,
            dragMode: 'move',
            touchDragZoom: true,
            wheelZoomRatio: 0.1,
            responsive: true,
            autoCropArea: 0.85,
            restore: false,
            guides: true,
            center: true,
            highlight: false,
            cropBoxMovable: true,
            cropBoxResizable: true,
            toggleDragModeOnDblclick: false,
            background: false,
            minContainerWidth: 280,
            minContainerHeight: 280
        });
    }

    sizePreset.addEventListener('change', function() {
        if (!cropper) return;
        if (this.value === '3.5/4.5') {
            cropper.setAspectRatio(3.5 / 4.5);
            cropper.crop();
        } else if (this.value === 'joint') {
            cropper.setAspectRatio(6 / 4); 
            cropper.crop();
        } else if (this.value === 'nocrop') {
            cropper.clear();
        } else {
            cropper.setAspectRatio(NaN);
            cropper.crop();
        }
    });

    async function fetchRemoveBg(blob, keyIndex = 0) {
        if (keyIndex >= API_KEYS.length) {
            throw new Error("API Keys exhausted.");
        }

        const formData = new FormData();
        formData.append('image_file', blob, 'photo.png');
        formData.append('size', 'auto');

        try {
            const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                method: 'POST',
                headers: {
                    'X-Api-Key': API_KEYS[keyIndex]
                },
                body: formData
            });

            if (response.ok) {
                deductCredit();
                return await response.blob();
            } else {
                return await fetchRemoveBg(blob, keyIndex + 1);
            }
        } catch (err) {
            return await fetchRemoveBg(blob, keyIndex + 1);
        }
    }

    function cropAndRemoveBg() {
        if (sizePreset.value === 'nocrop') {
            if (!originalFileBlob) return;
            startBgRemoval(originalFileBlob);
        } else {
            if (!cropper) return;
            const croppedCanvas = cropper.getCroppedCanvas({
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });
            croppedCanvas.toBlob(function(blob) {
                startBgRemoval(blob);
            }, 'image/png');
        }
    }

    async function startBgRemoval(blob) {
        document.getElementById('step-2').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        try {
            bgRemovedBlob = await fetchRemoveBg(blob);
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');
            renderFinalPhoto();
        } catch (err) {
            console.error(err);
            alert("Error removing background! API Keys might be exhausted or network error.");
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
        }
    }

    function setColor(hex) {
        document.getElementById('bg-color').value = hex;
        renderFinalPhoto();
    }

    function renderFinalPhoto() {
        if (!bgRemovedBlob) return;

        const canvas = document.getElementById('final-canvas');
        const ctx = canvas.getContext('2d');
        const bgColor = document.getElementById('bg-color').value;
        const borderOption = document.getElementById('border-option').value;

        const img = new Image();
        img.src = URL.createObjectURL(bgRemovedBlob);

        img.onload = () => {
            if (sizePreset.value === 'joint') {
                canvas.width = 3000;
                canvas.height = 2000;
            } else if (sizePreset.value === '3.5/4.5') {
                canvas.width = 1400;
                canvas.height = 1800;
            } else {
                canvas.width = 1800;
                canvas.height = 2200;
            }

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            if (borderOption !== 'none') {
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = borderOption === 'thick' ? Math.max(16, canvas.width / 40) : Math.max(6, canvas.width / 100);
                ctx.strokeRect(0, 0, canvas.width, canvas.height);
            }
        };
    }

    function downloadImage() {
        const canvas = document.getElementById('final-canvas');
        const format = document.ge
