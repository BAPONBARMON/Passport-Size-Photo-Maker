<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Size Photo Maker</title>
    <!-- Cropper.js for smooth cropping -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Prevents page scrolling */
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d0d0d;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            position: relative;
            width: 95vw;
            height: 94vh;
            background: #121212;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #00ff00;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        
        /* 3-DOT MENU STYLES */
        .menu-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #00ff00;
            user-select: none;
            padding: 0 8px;
            border-radius: 4px;
            z-index: 100;
        }
        .menu-btn:hover {
            background: #1a331a;
        }
        .dropdown-menu {
            position: absolute;
            top: 40px;
            right: 15px;
            background: #181818;
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 12px;
            width: 200px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            z-index: 101;
            text-align: left;
        }
        .credit-info {
            font-size: 0.85rem;
            color: #00ff00;
        }
        .credit-count {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            margin-top: 4px;
            display: block;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            text-align: center;
        }
        .step-section {
            width: 100%;
            height: calc(100% - 35px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px dashed #00ff00;
            border-radius: 8px;
            background: #181818;
            padding: 10px;
        }

        /* STYLISH MOBILE-FRIENDLY UPLOAD BOX */
        .upload-card {
            width: 90%;
            max-width: 400px;
            height: 220px;
            border: 2px dashed #00ff00;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            padding: 15px;
        }
        .upload-card:hover {
            background: #1a261a;
            border-color: #33ff33;
        }
        .upload-icon {
            font-size: 45px;
            margin-bottom: 10px;
            color: #00ff00;
        }
        .upload-card p {
            font-size: 0.95rem;
            color: #00ff00;
            font-weight: bold;
        }
        .upload-card span {
            font-size: 0.75rem;
            color: #888;
            margin-top: 5px;
        }
        #upload {
            display: none;
        }

        input, select {
            margin: 4px;
            padding: 6px 10px;
            background: #1e1e1e;
            color: #00ff00;
            border: 1px solid #00ff00;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        button {
            padding: 8px 14px;
            background: #00ff00;
            color: #0d0d0d;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            margin: 4px;
            border-radius: 4px;
        }
        button:hover {
            background: #00cc00;
        }
        .img-container {
            width: 100%;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            overflow: hidden;
        }
        #crop-image {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
        canvas {
            border: 1px solid #00ff00;
            max-width: 100%;
            max-height: 50vh;
            background-color: #1e1e1e;
            margin: 8px 0;
            object-fit: contain;
        }
        .hidden {
            display: none !important;
        }
        .color-presets {
            margin: 4px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .preset-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid #00ff00;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }
        
        /* HACKER GREEN SPINNER NO GLOW */
        #loading {
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #1a331a;
            border-top: 4px solid #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 0.9rem;
            color: #00ff00;
            animation: blink 1.5s infinite;
            text-align: center;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <!-- 3-Dot Menu Icon -->
    <div class="menu-btn" id="menu-icon" onclick="toggleMenu(event)">⋮</div>

    <!-- Dropdown Menu Box -->
    <div id="dropdown-menu" class="dropdown-menu hidden">
        <div class="credit-info">
            Total Credits Left:
            <span id="credit-display" class="credit-count">100 / 100</span>
        </div>
    </div>

    <h2>[ Passport Photo Maker ]</h2>

    <!-- Step 1: Upload Photo (Supports All Formats) -->
    <div id="step-1" class="step-section">
        <label for="upload" class="upload-card">
            <div class="upload-icon">📷</div>
            <p>TAP TO UPLOAD ANY PHOTO</p>
            <span>Supports PNG, JPG, JPEG, WEBP, HEIC, BMP, All Formats</span>
        </label>
        <input type="file" id="upload" accept="image/*, .png, .jpg, .jpeg, .webp, .heic, .bmp, .gif, .tiff, .svg, .avif">
    </div>

    <!-- Step 2: Crop Photo -->
    <div id="step-2" class="step-section hidden">
        <div class="img-container">
            <img id="crop-image" src="" alt="Crop Area">
        </div>
        <div class="controls-row">
            <label>Ratio: </label>
            <select id="size-preset">
                <option value="free" selected>Free Crop</option>
                <option value="nocrop">No Crop (Direct Process)</option>
                <option value="3.5/4.5">Standard Passport (3.5 x 4.5 cm)</option>
                <option value="2/2">US Visa / Square (2 x 2 inch)</option>
            </select>
            <button onclick="cropAndRemoveBg()">Process & Remove BG</button>
            <button onclick="fullReset()" style="background:#ff3333; color:#fff;">Change Photo</button>
        </div>
    </div>

    <!-- Loading Spinner Indicator -->
    <div id="loading" class="step-section hidden">
        <div class="spinner"></div>
        <div class="loading-text">[ Removing your background, please wait... ]</div>
    </div>

    <!-- Step 3: Final Preview & Customization -->
    <div id="step-3" class="step-section hidden">
        <canvas id="final-canvas"></canvas>

        <div class="controls-row">
            <label>BG Color: </label>
            <input type="color" id="bg-color" value="#ffffff" onchange="renderFinalPhoto()">
            
            <div class="color-presets">
                <button class="preset-btn" style="background:#ffffff;" onclick="setColor('#ffffff')"></button>
                <button class="preset-btn" style="background:#0055ff;" onclick="setColor('#0055ff')"></button>
                <button class="preset-btn" style="background:#00aaff;" onclick="setColor('#00aaff')"></button>
                <button class="preset-btn" style="background:#00ff00;" onclick="setColor('#00ff00')"></button>
            </div>

            <label>Border: </label>
            <select id="border-option" onchange="renderFinalPhoto()">
                <option value="none">No Border</option>
                <option value="thin">Thin Border</option>
                <option value="thick">Thick Border</option>
            </select>

            <label>Format: </label>
            <select id="download-format">
                <option value="image/png">PNG (HD)</option>
                <option value="image/jpeg">JPEG (HD)</option>
            </select>
        </div>

        <div class="controls-row" style="margin-top: 4px;">
            <button onclick="downloadImage()">Download HD</button>
            <button onclick="reCropCurrentPhoto()" style="background:#ffaa00; color:#0d0d0d;">Re-Crop Image</button>
            <button onclick="reCropAfterBgRemoved()" style="background:#00ffff; color:#0d0d0d;">Crop BG-Removed Photo</button>
        </div>
    </div>
</div>

<script>
    // HARDCODED API KEYS WITH FALLBACK
    const API_KEYS = [
        "TL3eqdjYhAZcL1ZZH3qaescs", // Server 1 (Primary)
        "is3ZKbYU9jNDVTFS1uru81RD"  // Server 2 (Fallback)
    ];

    let cropper = null;
    let bgRemovedBlob = null;
    let rawImageSrc = null;
    let originalFileBlob = null;

    // CREDIT TRACKER LOGIC
    let creditsLeft = localStorage.getItem('total_credits') ? parseInt(localStorage.getItem('total_credits')) : 100;
    updateCreditUI();

    function toggleMenu(event) {
        event.stopPropagation();
        document.getElementById('dropdown-menu').classList.toggle('hidden');
    }

    // Auto Hide Menu when clicking outside anywhere
    document.addEventListener('click', function(event) {
        const menu = document.getElementById('dropdown-menu');
        const menuBtn = document.getElementById('menu-icon');
        if (!menu.contains(event.target) && !menuBtn.contains(event.target)) {
            menu.classList.add('hidden');
        }
    });

    function updateCreditUI() {
        document.getElementById('credit-display').innerText = `${creditsLeft} / 100`;
    }

    function deductCredit() {
        if (creditsLeft > 0) {
            creditsLeft--;
            localStorage.setItem('total_credits', creditsLeft);
            updateCreditUI();
        }
    }

    const fileInput = document.getElementById('upload');
    const cropImgElement = document.getElementById('crop-image');
    const sizePreset = document.getElementById('size-preset');

    // Step 1: Upload File Handler (Supports All Formats)
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            originalFileBlob = file;
            const reader = new FileReader();
            reader.onload = function(event) {
                rawImageSrc = event.target.result;
                openCropperScreen(rawImageSrc);
            };
            reader.readAsDataURL(file);
        }
    });

    function openCropperScreen(imageSource) {
        cropImgElement.src = imageSource;
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('step-3').classList.add('hidden');
        document.getElementById('step-2').classList.remove('hidden');

        if (cropper) {
            cropper.destroy();
        }

        sizePreset.value = 'free';

        cropper = new Cropper(cropImgElement, {
            aspectRatio: NaN, // Free Crop by Default
            viewMode: 1,
            background: false
        });
    }

    // Handle Aspect Ratio Change
    sizePreset.addEventListener('change', function() {
        if (!cropper) return;
        if (this.value === '3.5/4.5') {
            cropper.setAspectRatio(3.5 / 4.5);
            cropper.crop();
        } else if (this.value === '2/2') {
            cropper.setAspectRatio(1);
            cropper.crop();
        } else if (this.value === 'nocrop') {
            cropper.clear();
        } else {
            cropper.setAspectRatio(NaN);
            cropper.crop();
        }
    });

    // Helper function to try API keys sequentially
    async function fetchRemoveBg(blob, keyIndex = 0) {
        if (keyIndex >= API_KEYS.length) {
            throw new Error("Both API keys exhausted or invalid.");
        }

        const formData = new FormData();
        formData.append('image_file', blob, 'photo.png');
        formData.append('size', 'auto');

        try {
            const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                method: 'POST',
                headers: {
                    'X-Api-Key': API_KEYS[keyIndex]
                },
                body: formData
            });

            if (response.ok) {
                deductCredit(); // Deduct Credit Automatically on Success
                return await response.blob();
            } else {
                console.warn(`API Key ${keyIndex + 1} failed with status: ${response.status}. Trying fallback key...`);
                return await fetchRemoveBg(blob, keyIndex + 1);
            }
        } catch (err) {
            console.warn(`API Key ${keyIndex + 1} encountered an error. Trying fallback key...`);
            return await fetchRemoveBg(blob, keyIndex + 1);
        }
    }

    // Process & Remove BG
    function cropAndRemoveBg() {
        if (sizePreset.value === 'nocrop') {
            if (!originalFileBlob) return;
            startBgRemoval(originalFileBlob);
        } else {
            if (!cropper) return;
            const croppedCanvas = cropper.getCroppedCanvas();
            croppedCanvas.toBlob(function(blob) {
                startBgRemoval(blob);
            }, 'image/png');
        }
    }

    async function startBgRemoval(blob) {
        document.getElementById('step-2').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        try {
            bgRemovedBlob = await fetchRemoveBg(blob);
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');
            renderFinalPhoto();
        } catch (err) {
            console.error(err);
            alert("Error removing background! All API Key credits might be exhausted.");
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
        }
    }

    function setColor(hex) {
        document.getElementById('bg-color').value = hex;
        renderFinalPhoto();
    }

    // Step 3: Draw Canvas in HD Quality
    function renderFinalPhoto() {
        if (!bgRemovedBlob) return;

        const canvas = document.getElementById('final-canvas');
        const ctx = canvas.getContext('2d');
        const bgColor = document.getElementById('bg-color').value;
        const borderOption = document.getElementById('border-option').value;

        const img = new Image();
        img.src = URL.createObjectURL(bgRemovedBlob);

        img.onload = () => {
            canvas.width = 1400;
            canvas.height = 1800;

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            if (borderOption !== 'none') {
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = borderOption === 'thick' ? 40 : 16;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);
            }
        };
    }

    // Download HD Image
    function downloadImage() {
        const canvas = document.getElementById('final-canvas');
        const format = document.getElementById('download-format').value;
        const ext = format === 'image/jpeg' ? 'jpg' : 'png';

        const link = document.createElement('a');
        link.href = canvas.toDataURL(format, 1.0);
        link.download = `passport_photo_hd.${ext}`;
        link.click();
    }

    // Re-Crop original photo
    function reCropCurrentPhoto() {
        openCropperScreen(rawImageSrc);
    }

    // Re-crop after Background Removal
    function reCropAfterBgRemoved() {
        if (!bgRemovedBlob) return;
        const bgRemovedUrl = URL.createObjectURL(bgRemovedBlob);
        openCropperScreen(bgRemovedUrl);
    }

    // Complete Reset
    function fullReset() {
        rawImageSrc = null;
        bgRemovedBlob = null;
        originalFileBlob = null;
        document.getElementById('step-2').classList.add('hidden');
        document.getElementById('step-3').classList.add('hidden');
        document.getElementById('step-1').classList.remove('hidden');
        fileInput.value = '';
        if (cropper) cropper.destroy();
    }
</script>

</body>
</html>
